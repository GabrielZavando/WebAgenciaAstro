name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Type Check and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (astro check)
        run: pnpm exec astro check

      - name: Build Project
        run: pnpm build
        env:
          PUBLIC_API_URL: http://localhost:8080
          PUBLIC_FIREBASE_PROJECT_ID: demo-project
          PUBLIC_FIREBASE_API_KEY: placeholder
          PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder
          PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: placeholder
          PUBLIC_FIREBASE_APP_ID: placeholder
          PUBLIC_TURNSTILE_SITE_KEY: placeholder
          PUBLIC_GTM_ID: placeholder

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Dependencies (OS)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          PUBLIC_API_URL: http://localhost:8080
          BASE_URL: http://localhost:4321
