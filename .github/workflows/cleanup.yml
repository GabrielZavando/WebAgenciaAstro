name: Cleanup Preview Environments

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    env:
      PROJECT_ID: agenciadigital-445923
      REGION: us-central1
      SERVICE_NAME: landing-pr-${{ github.event.number }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/201828783555/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@agenciadigital-445923.iam.gserviceaccount.com

      - name: Delete Cloud Run Preview Service
        run: |
          gcloud run services delete ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --quiet || true
